name: Sync other challenges
# test: use this branch as intermediate branch to sync changes from scaffold-stark-2 to speedrunstark

on:
  push:
    branches:
      - feat/auto-merge
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false # Allows other merges to continue even if one fails
      matrix:
        challenge_branch:
          - challenge-0-simple-nft
          # - challenge-1-decentralized-staking
          # - challenge-2-token-vendor
          # - challenge-3-dice-game
          # - challenge-4-build-a-dex
          # - challenge-5-multisig-wallet

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
            repository: Scaffold-Stark/speedrunstark
            token: ${{ secrets.ORG_GITHUB_TOKEN }}
            fetch-depth: 0

      - name: Setup Python # Make sure to use the correct version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies (tomli/tomli_w for TOML handling)
        run: |
          python3 -m pip install --upgrade pip
          pip install tomli_w
          echo "Required Python libraries installed."

      - name: Setup Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git config --local merge.keepmine.name "keep-mine"
          git config --local merge.keepmine.driver "true"

          git config --local merge.keeptheirs.name "keep-theirs"
          git config --local merge.keeptheirs.driver 'cp %B %A'

          git config --local merge.mergedeps.name "merge-deps"
          git config --local merge.mergedeps.driver "python3 ~/merge_dependencies.py %O %A %B %P"
          git config --local merge.mergedeps.recursive binary

      - name: Pull Latest Changes
        run: |
          git checkout feat/auto-merge
          git pull origin feat/auto-merge
          cp .github/scripts/merge_dependencies.py ~

      - name: Update Challenge ${{ matrix.challenge_branch }}
        run: |
          echo "Merging feat/auto-merge into ${{ matrix.challenge_branch }}..."
          git checkout challenge-0-simple-nft

          git merge feat/auto-merge --no-edit
          ./.github/scripts/clean_redundant_files.sh
          git push origin ${{ matrix.challenge_branch }}

      - name: Notify Slack on Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: "Successfully synced scaffold-stark-2 changes to speedrunstark repository and updated all step branches."
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: "Failed to sync scaffold-stark-2 changes to speedrunstark repository."
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}